<svg xmlns="http://www.w3.org/2000/svg" width="358" height="349" viewBox="0 0 358 349" role="img" aria-label="One browser window. Every session on every machine, sorted so the ones that need you are on top. Hands-free. Send the next instruction by voice, and have answers read back. Nothing to install. One Node file, one HTML file. No npm dependencies, no build step, no cloud service."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🪟 One browser window</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Every session on every machine, sorted so</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">the ones that need you are on top.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🎙️ Hands-free</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Send the next instruction by voice, and</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">have answers read back.</text></g><g transform="translate(0.0,224)"><clipPath id="c2_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">📦 Nothing to install</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One Node file, one HTML file. No npm</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">dependencies, no build step, no cloud</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">service.</text></g></g></svg>
