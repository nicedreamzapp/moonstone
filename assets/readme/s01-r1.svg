<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="One window. Every session on every machine, the ones that need you on top. Hands-free. Send the next instruction by voice and hear the answer read back. Nothing to install. One Node file, one HTML file. No npm packages, no build, no cloud."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🪟 One window</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Every session on every</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">machine, the ones that need</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">you on top.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🎙️ Hands-free</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Send the next instruction by</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">voice and hear the answer</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">read back.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">📦 Nothing to install</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">One Node file, one HTML</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">file. No npm packages, no</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">build, no cloud.</text></g></g></svg>
