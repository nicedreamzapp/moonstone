<svg xmlns="http://www.w3.org/2000/svg" width="358" height="349" viewBox="0 0 358 349" role="img" aria-label="Sorted by what needs you. Waiting on a permission prompt, then errors, then new answers, then working, then idle. Tidy by itself. Sessions you open but never use tidy themselves away after 30 minutes. Warm spares. One idle `claude` process per launcher, so a new session skips the startup wait."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">📋 Sorted by what needs you</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Waiting on a permission prompt, then</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">errors, then new answers, then working,</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">then idle.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🧹 Tidy by itself</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Sessions you open but never use tidy</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">themselves away after 30 minutes.</text></g><g transform="translate(0.0,247)"><clipPath id="c2_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🔥 Warm spares</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One idle `claude` process per launcher, so</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">a new session skips the startup wait.</text></g></g></svg>
