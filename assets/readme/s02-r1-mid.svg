<svg xmlns="http://www.w3.org/2000/svg" width="560" height="238" viewBox="0 0 560 238" role="img" aria-label="Model picker. Claude, free cloud models and models on your own Mac, with the allowance left on each. Two accounts, one Auto. New chats go to the least-used Claude account and move over at 90%. Usage at a glance. 5-hour and weekly % left for every account, with time to reset."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="274.2" height="148" rx="10"/></clipPath><rect width="274.2" height="148" rx="10" fill="url(#n)"/><rect width="274.2" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="273.2" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🎛️ Model picker</text><text x="139" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Claude, free cloud models and</text><text x="139" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">models on your own Mac, with</text><text x="139" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">the allowance left on each.</text></g><g transform="translate(284.2,0)"><clipPath id="c0_1"><rect width="275.8" height="148" rx="10"/></clipPath><rect width="275.8" height="148" rx="10" fill="url(#n)"/><rect width="275.8" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.8" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">⚖️ Two accounts, one</text><text x="140" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#decdd4">Auto</text><text x="140" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">New chats go to the least-used</text><text x="140" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">Claude account and move over</text><text x="140" text-anchor="middle" y="133" font-size="16" font-weight="500" fill="#f2f5fa">at 90%.</text></g><g transform="translate(0.0,158)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">📊 Usage at a glance</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">5-hour and weekly % left for every account, with time to reset.</text></g></g></svg>
