<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="Model picker. Claude, free cloud models and models on your own Mac, with the allowance left on each. Two accounts, one Auto. New chats go to the least-used Claude account and move over at 90%. Usage at a glance. 5-hour and weekly % left for every account, with time to reset."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="270.7" height="157" rx="10"/></clipPath><rect width="270.7" height="157" rx="10" fill="url(#n)"/><rect width="270.7" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="269.7" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="137" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🎛️ Model picker</text><text x="137" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Claude, free cloud models</text><text x="137" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">and models on your own</text><text x="137" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Mac, with the allowance left</text><text x="137" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">on each.</text></g><g transform="translate(282.7,0)"><clipPath id="c0_1"><rect width="304.5" height="157" rx="10"/></clipPath><rect width="304.5" height="157" rx="10" fill="url(#n)"/><rect width="304.5" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="303.5" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="154" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">⚖️ Two accounts, one</text><text x="154" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">Auto</text><text x="154" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">New chats go to the least-used</text><text x="154" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Claude account and move over at</text><text x="154" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">90%.</text></g><g transform="translate(599.2,0)"><clipPath id="c0_2"><rect width="220.8" height="157" rx="10"/></clipPath><rect width="220.8" height="157" rx="10" fill="url(#n)"/><rect width="220.8" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="219.8" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="112" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">📊 Usage at a</text><text x="112" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">glance</text><text x="112" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">5-hour and weekly %</text><text x="112" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">left for every account,</text><text x="112" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">with time to reset.</text></g></g></svg>
