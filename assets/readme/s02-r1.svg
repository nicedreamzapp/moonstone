<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="Sorted by what needs you. Waiting on a permission prompt, then errors, then new answers, then working, then idle. Tidy by itself. Sessions you open but never use tidy themselves away after 30 minutes. Warm spares. One idle claude process per launcher, so a new session skips the startup wait."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="292.3" height="157" rx="10"/></clipPath><rect width="292.3" height="157" rx="10" fill="url(#n)"/><rect width="292.3" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="291.3" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="148" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">📋 Sorted by what needs</text><text x="148" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decdd4">you</text><text x="148" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Waiting on a permission prompt,</text><text x="148" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">then errors, then new answers,</text><text x="148" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">then working, then idle.</text></g><g transform="translate(304.3,0)"><clipPath id="c0_1"><rect width="238.7" height="157" rx="10"/></clipPath><rect width="238.7" height="157" rx="10" fill="url(#n)"/><rect width="238.7" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="237.7" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="121" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🧹 Tidy by itself</text><text x="121" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Sessions you open but</text><text x="121" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">never use tidy</text><text x="121" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">themselves away after 30</text><text x="121" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">minutes.</text></g><g transform="translate(555.1,0)"><clipPath id="c0_2"><rect width="264.9" height="157" rx="10"/></clipPath><rect width="264.9" height="157" rx="10" fill="url(#n)"/><rect width="264.9" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="263.9" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="134" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🔥 Warm spares</text><text x="134" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">One idle claude process per</text><text x="134" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">launcher, so a new session</text><text x="134" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">skips the startup wait.</text></g></g></svg>
