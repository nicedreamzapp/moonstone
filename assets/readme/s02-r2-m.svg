<svg xmlns="http://www.w3.org/2000/svg" width="358" height="326" viewBox="0 0 358 326" role="img" aria-label="Finish times. Working cards say &quot;done ~5:46 PM&quot; with a progress bar, not how long ago. Tap answers. The options in Claude&#x27;s question become buttons. Typing always wins. Stall watch. A STALLED or LONG TOOL badge when a chat goes quiet too long."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">⏱️ Finish times</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Working cards say &quot;done ~5:46 PM&quot; with a</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">progress bar, not how long ago.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">👆 Tap answers</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The options in Claude&#x27;s question become</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">buttons. Typing always wins.</text></g><g transform="translate(0.0,224)"><clipPath id="c2_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🚨 Stall watch</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A STALLED or LONG TOOL badge when a</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">chat goes quiet too long.</text></g></g></svg>
