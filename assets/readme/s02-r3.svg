<svg xmlns="http://www.w3.org/2000/svg" width="820" height="136" viewBox="0 0 820 136" role="img" aria-label="Auto, free and fast. Free cloud models are re-timed every 6 hours. The fastest one that can see and use tools gets picked, new free promos included. Slow models hand off: no first word in 10 seconds and Claude takes over."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="820.0" height="136" rx="10"/></clipPath><rect width="820.0" height="136" rx="10" fill="url(#n)"/><rect width="820.0" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="819.0" height="135" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="411" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">⚡ Auto, free and fast</text><text x="411" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Free cloud models are re-timed every 6 hours. The fastest one that can see and use</text><text x="411" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">tools gets picked, new free promos included. Slow models hand off: no first word in</text><text x="411" text-anchor="middle" y="118" font-size="17" font-weight="500" fill="#f2f5fa">10 seconds and Claude takes over.</text></g></g></svg>