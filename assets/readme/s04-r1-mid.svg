<svg xmlns="http://www.w3.org/2000/svg" width="560" height="237" viewBox="0 0 560 237" role="img" aria-label="Sorted by need. Permission prompts first, then errors, new answers, working, idle. Grouped by machine. Live GPU gauge and RAM bar on every machine, measured like Activity Monitor. Model colours. Each card wears its model&#x27;s colour and tag, the machine colour as its ring."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">📋 Sorted by need</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Permission prompts first, then</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">errors, new answers, working,</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">idle.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🖥️ Grouped by machine</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Live GPU gauge and RAM bar</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">on every machine, measured</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">like Activity Monitor.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#4f7a4a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🎨 Model colours</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Each card wears its model&#x27;s colour and tag, the machine colour as its</text><text x="282" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">ring.</text></g></g></svg>
