<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Push to talk. Tap the mic, talk, tap again to send. Enter does the same. Narration. Tap the speaker and every finished answer is read aloud. Stays local. Transcription and speech run on your own machines."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="261.8" height="133" rx="10"/></clipPath><rect width="261.8" height="133" rx="10" fill="url(#n)"/><rect width="261.8" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="260.8" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="133" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🎤 Push to talk</text><text x="133" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Tap the mic, talk, tap again</text><text x="133" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">to send. Enter does the</text><text x="133" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">same.</text></g><g transform="translate(273.8,0)"><clipPath id="c0_1"><rect width="261.8" height="133" rx="10"/></clipPath><rect width="261.8" height="133" rx="10" fill="url(#n)"/><rect width="261.8" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="260.8" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="133" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🔊 Narration</text><text x="133" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Tap the speaker and every</text><text x="133" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">finished answer is read</text><text x="133" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">aloud.</text></g><g transform="translate(547.6,0)"><clipPath id="c0_2"><rect width="272.4" height="133" rx="10"/></clipPath><rect width="272.4" height="133" rx="10" fill="url(#n)"/><rect width="272.4" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="271.4" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="138" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🏠 Stays local</text><text x="138" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Transcription and speech run</text><text x="138" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">on your own machines.</text></g></g></svg>
