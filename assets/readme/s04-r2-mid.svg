<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img" aria-label="Two kinds of sessions. Headless ones Moonstone owns, and terminal ones it reads and can take over. Smart launchers. A star marks the least busy machine. Tap a chip to pin one. Warm spares. One idle claude per launcher, so a new chat skips the startup wait."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="293.6" height="125" rx="10"/></clipPath><rect width="293.6" height="125" rx="10" fill="url(#n)"/><rect width="293.6" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="292.6" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🔀 Two kinds of sessions</text><text x="149" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Headless ones Moonstone owns,</text><text x="149" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">and terminal ones it reads and can</text><text x="149" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">take over.</text></g><g transform="translate(303.6,0)"><clipPath id="c0_1"><rect width="256.4" height="125" rx="10"/></clipPath><rect width="256.4" height="125" rx="10" fill="url(#n)"/><rect width="256.4" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="255.4" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🚀 Smart launchers</text><text x="130" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A star marks the least busy</text><text x="130" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">machine. Tap a chip to pin</text><text x="130" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">one.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#4f7a4a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🔥 Warm spares</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One idle claude per launcher, so a new chat skips the startup wait.</text></g></g></svg>
