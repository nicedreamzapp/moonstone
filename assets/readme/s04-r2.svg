<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Two kinds of sessions. Headless ones Moonstone owns, and terminal ones it reads and can take over. Smart launchers. A star marks the least busy machine. Tap a chip to pin one. Warm spares. One idle claude per launcher, so a new chat skips the startup wait."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="285.1" height="133" rx="10"/></clipPath><rect width="285.1" height="133" rx="10" fill="url(#n)"/><rect width="285.1" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="284.1" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="145" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🔀 Two kinds of sessions</text><text x="145" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Headless ones Moonstone</text><text x="145" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">owns, and terminal ones it</text><text x="145" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">reads and can take over.</text></g><g transform="translate(297.1,0)"><clipPath id="c0_1"><rect width="255.5" height="133" rx="10"/></clipPath><rect width="255.5" height="133" rx="10" fill="url(#n)"/><rect width="255.5" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="254.5" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🚀 Smart launchers</text><text x="130" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">A star marks the least busy</text><text x="130" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">machine. Tap a chip to pin</text><text x="130" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">one.</text></g><g transform="translate(564.5,0)"><clipPath id="c0_2"><rect width="255.5" height="133" rx="10"/></clipPath><rect width="255.5" height="133" rx="10" fill="url(#n)"/><rect width="255.5" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="254.5" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🔥 Warm spares</text><text x="130" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">One idle claude per</text><text x="130" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">launcher, so a new chat</text><text x="130" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">skips the startup wait.</text></g></g></svg>
