<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Idle shutdown. A `pipe` chat or a server Moonstone started is shut down after 30 idle minutes and comes back on the next message. Same server everywhere. Every machine runs the same `server.js`."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="488.1" height="133" rx="10"/></clipPath><rect width="488.1" height="133" rx="10" fill="url(#n)"/><rect width="488.1" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="487.1" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="246" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">💤 Idle shutdown</text><text x="246" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">A `pipe` chat or a server Moonstone started is shut down</text><text x="246" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">after 30 idle minutes and comes back on the next</text><text x="246" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">message.</text></g><g transform="translate(500.1,0)"><clipPath id="c0_1"><rect width="319.9" height="133" rx="10"/></clipPath><rect width="319.9" height="133" rx="10" fill="url(#n)"/><rect width="319.9" height="4" fill="#5a4f8f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="318.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="162" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">🧩 Same server everywhere</text><text x="162" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Every machine runs the same</text><text x="162" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">`server.js`.</text></g></g></svg>
