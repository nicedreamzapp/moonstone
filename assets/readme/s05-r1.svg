<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Real approvals. Permission prompts arrive as Allow / Don&#x27;t cards. Nothing is auto-approved. Your turn. A pulsing blue badge and a banner quoting the question when Claude needs you. Background work. Live cards for agents and jobs, with the latest step, a progress bar and an ETA."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">🔐 Real approvals</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Permission prompts arrive</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">as Allow / Don&#x27;t cards.</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Nothing is auto-approved.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#5a4f8f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor