<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" role="img" aria-label="Requests checklist. Every chat tracks what you asked for, like 3/4 done. Safe to close. A green pill when every request is done and nothing is running. When Claude runs out. A chat that hits the limit keeps going on a local model, then hands back."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="102" rx="10"/></clipPath><rect width="275.0" height="102" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#d0cddf">🏷️ Requests checklist</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Every chat tracks what you</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">asked for, like 3/4 done.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="102" rx="10"/></clipPath><rect width="275.0" height="102" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#5a4f8f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#d0cddf">🟢 Safe to close</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A green pill when every request</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">is done and nothing is running.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#5a4f8f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#d0cddf">🛟 When Claude runs out</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A chat that hits the limit keeps going on a local model, then hands</text><text x="282" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">back.</text></g></g></svg>
