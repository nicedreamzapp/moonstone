<svg xmlns="http://www.w3.org/2000/svg" width="560" height="216" viewBox="0 0 560 216" role="img" aria-label="Loopback only. The server listens on `127.0.0.1`. Other machines use SSH tunnels. Approvals stay with you. Prompts come to the window instead of being auto-accepted. Audio stays local. Temporary audio files are deleted after each transcription."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6f96"/><stop offset="1" stop-color="#2f7f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="272.2" height="126" rx="10"/></clipPath><rect width="272.2" height="126" rx="10" fill="url(#n)"/><rect width="272.2" height="4" fill="#3f6f96" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="271.2" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="138" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c9d6e1">🔁 Loopback only</text><text x="138" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The server listens on</text><text x="138" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">`127.0.0.1`. Other machines use</text><text x="138" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">SSH tunnels.</text></g><g transform="translate(282.2,0)"><clipPath id="c0_1"><rect width="277.8" height="126" rx="10"/></clipPath><rect width="277.8" height="126" rx="10" fill="url(#n)"/><rect width="277.8" height="4" fill="#3f6f96" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="276.8" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="141" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c9d6e1">🛡️ Approvals stay with</text><text x="141" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#c9d6e1">you</text><text x="141" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">Prompts come to the window</text><text x="141" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">instead of being auto-accepted.</text></g><g transform="translate(0.0,136)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#3f6f96" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c9d6e1">🎧 Audio stays local</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Temporary audio files are deleted after each transcription.</text></g></g></svg>
