<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Loopback only. The server listens on `127.0.0.1`. Other machines use SSH tunnels. Approvals stay with you. Prompts come to the window instead of being auto-accepted. Audio stays local. Temporary audio files are deleted after each transcription."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6f96"/><stop offset="1" stop-color="#2f7f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="254.6" height="133" rx="10"/></clipPath><rect width="254.6" height="133" rx="10" fill="url(#n)"/><rect width="254.6" height="4" fill="#3f6f96" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="253.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="129" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c9d6e1">🔁 Loopback only</text><text x="129" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The server listens on</text><text x="129" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">`127.0.0.1`. Other</text><text x="129" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">machines use SSH tunnels.</text></g><g transform="translate(266.6,0)"><clipPath id="c0_1"><rect width="286.9" height="133" rx="10"/></clipPath><rect width="286.9" height="133" rx="10" fill="url(#n)"/><rect width="286.9" height="4" fill="#3f6f96" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="285.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="145" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c9d6e1">🛡️ Approvals stay with</text><text x="145" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#c9d6e1">you</text><text x="145" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Prompts come to the window</text><text x="145" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">instead of being auto-accepted.</text></g><g transform="translate(565.4,0)"><clipPath id="c0_2"><rect width="254.6" height="133" rx="10"/></clipPath><rect width="254.6" height="133" rx="10" fill="url(#n)"/><rect width="254.6" height="4" fill="#3f6f96" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="253.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="129" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c9d6e1">🎧 Audio stays local</text><text x="129" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Temporary audio files are</text><text x="129" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">deleted after each</text><text x="129" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">transcription.</text></g></g></svg>
