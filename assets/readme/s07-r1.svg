<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Any local server. llama.cpp, Ollama, LM Studio, MLX chat loops or any OpenAI-style endpoint. Idle unload. Idle models unload after 15 minutes. The chat stays, the next message reloads. Frozen model watch. A model that goes quiet gets flagged, and a stuck hosted one is stopped."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6f96"/><stop offset="1" stop-color="#2f7f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#3f6f96" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c9d6e1">🧩 Any local server</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">llama.cpp, Ollama, LM</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Studio, MLX chat loops or</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">any OpenAI-style endpoint.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#3f6f96" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" 