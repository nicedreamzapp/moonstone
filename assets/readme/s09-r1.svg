<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="Loopback only. The server listens on 127.0.0.1. Other machines use SSH tunnels. Approvals stay with you. Prompts come to the window instead of being auto-accepted. Audio stays local. Audio files are deleted after each transcription."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f7f"/><stop offset="1" stop-color="#9a5a6a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="287.0" height="157" rx="10"/></clipPath><rect width="287.0" height="157" rx="10" fill="url(#n)"/><rect width="287.0" height="4" fill="#8a4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="286.0" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="145" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🔁 Loopback only</text><text x="145" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The server listens on 127.0.0.1.</text><text x="145" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Other machines use SSH</text><text x="145" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">tunnels.</text></g><g transform="translate(299.0,0)"><clipPath id="c0_1"><rect width="302.3" height="157" rx="10"/></clipPath><rect width="302.3" height="157" rx="10" fill="url(#n)"/><rect width="302.3" height="4" fill="#8a4f7f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="301.3" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="153" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🛡️ Approvals stay with</text><text x="153" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decddb">you</text><text x="153" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Prompts come to the window</text><text x="153" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">instead of being auto-accepted.</text></g><g transform="translate(613.2,0)"><clipPath id="c0_2"><rect width="206.8" height="157" rx="10"/></clipPath><rect width="206.8" height="157" rx="10" fill="url(#n)"/><rect width="206.8" height="4" fill="#8a4f7f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="205.8" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="105" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🎧 Audio stays</text><text x="105" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#decddb">local</text><text x="105" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Audio files are</text><text x="105" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">deleted after each</text><text x="105" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">transcription.</text></g></g></svg>
