<!doctype html>
<html lang="en">
<script>if(/(?:^|; )ms_who=guest/.test(document.cookie)) document.documentElement.classList.add("mel");</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonstone Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Liquid glass on a slow aurora. Each machine gets its own accent color (config "color", else the palette below). */
:root{
  color-scheme:dark;
  --bg0:#03040b; --fg:#eef0fb; --dim:#9aa1c4; --faint:#5d6489;
  --glass:rgba(10,12,28,.62); --glass2:rgba(16,19,40,.7); --rim:rgba(255,255,255,.12); --rim2:rgba(255,255,255,.06);
  --m0:#9b7bff; --phone:#5cc8ff;
  --ok:#3ee08f; --need:#ffab3d; --err:#ff5f7a;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--fg);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #c9bcff;outline-offset:2px;border-radius:8px}

/* aurora: eight color blobs, each drifting on its own loop, plus a slow hue swing */
.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(70px) saturate(1.4) brightness(.5);animation:hue 30s ease-in-out infinite alternate}
.aurora i{position:absolute;border-radius:50%;opacity:.8;mix-blend-mode:screen}
.aurora i:nth-child(1){width:55%;height:50%;left:5%;top:5%;background:#6a3cff;animation:a1 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:50%;height:45%;right:0;top:20%;background:#1aa8ff;animation:a2 22s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:55%;height:45%;left:10%;bottom:5%;background:#d0389f;animation:a3 26s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:45%;height:40%;right:5%;bottom:0;background:#19d3c5;animation:a4 20s ease-in-out infinite alternate}
.aurora i:nth-child(5){width:70%;height:60%;left:15%;top:25%;background:#1b1f78;opacity:.9;animation:a5 34s ease-in-out infinite alternate}
.aurora i:nth-child(6){width:30%;height:28%;left:55%;top:55%;background:#ff7a8a;opacity:.55;animation:a6 24s ease-in-out infinite alternate}
.aurora i:nth-child(7){width:32%;height:30%;left:0;top:45%;background:#3fe08a;opacity:.45;animation:a7 28s ease-in-out infinite alternate}
.aurora i:nth-child(8){width:26%;height:24%;right:15%;top:0;background:#ffc46b;opacity:.4;animation:a8 21s ease-in-out infinite alternate}
@keyframes a6{to{transform:translate(-60%,-70%) scale(1.4)}}
@keyframes a7{to{transform:translate(90%,-30%) scale(1.2)}}
@keyframes a8{to{transform:translate(-80%,120%) scale(1.3)}}
@keyframes a1{to{transform:translate(35%,40%) scale(1.25)}}
@keyframes a2{to{transform:translate(-45%,35%) scale(.85)}}
@keyframes a3{to{transform:translate(30%,-50%) scale(1.2)}}
@keyframes a4{to{transform:translate(-40%,-45%) scale(1.3)}}
@keyframes a5{to{transform:translate(-15%,10%) rotate(40deg) scale(1.1)}}
@keyframes hue{to{filter:blur(70px) saturate(1.4) brightness(.5) hue-rotate(-35deg)}}

/* 10/5 the user: usage bar buffered from the top + bigger font. .uq not .u — .u is the chat-bubble class */
:root{--uh:calc(48px + env(safe-area-inset-top))}
#usage{position:relative;z-index:2;box-sizing:border-box;height:var(--uh);display:flex;align-items:center;justify-content:center;gap:22px;font-size:15px;color:var(--fg);opacity:.9;white-space:nowrap;overflow:hidden;padding:calc(14px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.18)}
#usage:empty{display:none}
#usage .uq{display:inline-flex;align-items:center;gap:7px}
#usage .uq b{font-weight:600}
#usage .ub{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:inline-block}
#usage .ub i{display:block;height:100%}
#usage .ur{opacity:.6}
body.has-usage .app{height:calc((100dvh - var(--uh) - 1px - var(--kb,0px)) / 1.2)}
.app{position:relative;z-index:1;height:calc((100dvh - var(--kb,0px)) / 1.2);zoom:1.2;display:flex;flex-direction:column;padding:10px;gap:10px}
.glass{background:var(--glass);border:1px solid var(--rim);border-radius:18px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25)}

/* brand */
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 0;font-size:19px;font-weight:600;letter-spacing:.03em;
  background:linear-gradient(90deg,#d9ccff,#9fe8ff 60%,#ffc2e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .orb{width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#c9d6ff 22%,#7c6bff 58%,#2a2560 100%);box-shadow:0 0 14px #8f7bff}

/* list view */
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;scrollbar-width:thin}
.machine{position:relative;padding:10px 10px 8px 14px;overflow:hidden;flex-shrink:0}
.machine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 18px var(--c)}
.machine::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 55%);pointer-events:none}
/* 10/21: each machine's whole section carries a faint wash of its own colour, so the machines read apart at a glance */
.machine{background:linear-gradient(165deg,color-mix(in srgb,var(--c) 12%,var(--glass)),color-mix(in srgb,var(--c) 5%,var(--glass)) 70%);border-color:color-mix(in srgb,var(--c) 26%,var(--rim))}
.machine .card{background:color-mix(in srgb,var(--c) 5%,transparent);margin-top:3px;border-top-color:transparent}
.machine .card:first-child{margin-top:0}
.machine .card:hover{background:color-mix(in srgb,var(--c) 11%,transparent)}
.machine.off{opacity:.6}
.m-head[data-pickm]{cursor:pointer}
.machine.sel{box-shadow:inset 0 0 0 1px var(--c),0 0 22px color-mix(in srgb,var(--c) 30%,transparent)}
.lhere{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;padding:2px 4px 8px;color:var(--c)}
.m-head{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:2px 4px 8px}
.m-name{font-size:17px;font-weight:600;color:var(--c);letter-spacing:.02em}
.m-note{font-family:var(--mono);font-size:11px;color:var(--dim)}
.m-head .ip-stop{flex:none;margin-left:2px;height:20px;padding:0 9px;border-radius:999px;font:600 10px/1 var(--mono);letter-spacing:.06em;color:#ffb3bf;background:rgba(214,48,74,.16);border:1px solid rgba(255,107,127,.6);cursor:pointer;display:inline-flex;align-items:center}
.m-head .ip-stop:hover{color:#fff;background:rgba(214,48,74,.45)}
.m-head .ip-stop.on{color:#fff;background:#d6304a;border-color:#ff6b7f;box-shadow:0 0 10px rgba(214,48,74,.5);cursor:default}
.m-head .plus.ipp{margin-left:auto}
.ip-on{font-family:var(--mono);font-size:11px;color:var(--c)}
.gpu{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:3px}
.stats{margin-left:auto;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px 12px}
.stats .gpu{margin-left:0}
/* 11/1 the user: RAM is the number he can act on - a fill level, and running out is what actually kills a
   model or the machine. GPU is only "busy right now": it swings 0->100 between tokens, so 100% read as
   a warning when it never was one. RAM goes first and bright, GPU second, dim, and labelled BUSY. */
.stats .ram{font-size:12px;color:var(--fg)}
.stats .ram .bar{width:64px;height:7px}
.stats .ram.warn{color:var(--need)}
.stats .ram.hot{color:var(--err)}
.stats .busy{font-size:10px;color:var(--faint)}
.stats .busy .segs i{width:7px;height:7px;border-radius:2px}
.stats .busy .segs i.on{box-shadow:none;opacity:.55}
.bar{width:54px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;border-radius:3px}
.segs i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.08);border:1px solid var(--rim2)}
.segs i.on{background:var(--c);box-shadow:0 0 8px var(--c);border-color:transparent}
.cards{position:relative;z-index:1;display:flex;flex-direction:column}
.card{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:8px 6px;border-top:1px solid var(--rim2);text-align:left;width:100%;border-radius:10px}
.card:first-child{border-top:0}
.card:hover{background:rgba(255,255,255,.05)}
.card{position:relative}
.end{position:absolute;right:4px;top:4px;display:none;padding:1px 8px;border-radius:999px;font-size:13px;color:var(--dim);background:rgba(0,0,0,.45);border:1px solid var(--rim)}
.card:hover .end,.end.armed{display:inline-block}
@media (hover:none){.end{display:inline-block}}
.end:hover{color:#ffc2cc;border-color:rgba(255,95,122,.5)}
.end.armed{color:#fff;background:rgba(255,95,122,.4);border-color:var(--err);font-size:11.5px;font-weight:600}
.c-name{font-weight:400;font-size:13px;color:var(--fg);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.c-name small{color:var(--dim);font-weight:400;margin-left:6px}
/* 10/26: model = the card's fill + tag, device = the ring (famOf / MODEL_FAMS in the script) */
.cards .card.mf{background:linear-gradient(95deg,color-mix(in srgb,var(--mc) 27%,transparent),color-mix(in srgb,var(--mc) 9%,transparent) 80%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 55%,transparent);border-top-color:transparent}
.cards .card.mf:hover{background:linear-gradient(95deg,color-mix(in srgb,var(--mc) 36%,transparent),color-mix(in srgb,var(--mc) 14%,transparent) 80%)}
.cards .card.mf::before{content:"";position:absolute;left:3px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--mc);box-shadow:0 0 8px color-mix(in srgb,var(--mc) 60%,transparent)}
.ulm{display:inline-block;font:600 9px/13px var(--mono);font-style:normal;padding:0 5px;margin-right:6px;border-radius:999px;vertical-align:1px;color:var(--mc);border:1px dashed var(--mc);opacity:.75;white-space:nowrap}
.mtag{display:inline-block;font:700 9.5px/14px var(--mono);font-style:normal;letter-spacing:.04em;padding:0 5px;margin-right:6px;border-radius:999px;vertical-align:1px;color:#0b0b14;background:var(--mc);white-space:nowrap}
.c-last{grid-column:2/4;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11.5px;color:var(--dim);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;justify-self:center}
#stallbar{position:sticky;top:0;z-index:50;display:block;width:100%;border:0;margin:0;padding:6px 12px;font:600 12px/1.3 inherit;
  text-align:left;color:#fff;background:rgba(200,60,60,.88);backdrop-filter:blur(8px);cursor:pointer;border-radius:0 0 10px 10px}
.s-cooking .dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:beat 1.6s ease-in-out infinite}
.s-idle .dot{background:radial-gradient(circle at 35% 30%,#8f96c0,#3a3f66)}
.s-answered .dot{background:#4aa8ff;box-shadow:0 0 10px #4aa8ff}
.s-error .dot{background:var(--err);box-shadow:0 0 10px var(--err)}
.s-needs .dot{background:var(--need);box-shadow:0 0 0 3px rgba(255,171,61,.25),0 0 14px var(--need)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.badge.need{color:#ffd28c;background:rgba(255,171,61,.16);border:1px solid rgba(255,171,61,.55);box-shadow:0 0 16px rgba(255,171,61,.35);animation:glow 1.6s ease-in-out infinite}
.badge.need::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--need)}
/* background work (10/25): violet, pulsing, until the task-notification says it finished */
.badge.bgw{color:#e6d4ff;background:rgba(181,124,255,.18);border:1px solid rgba(181,124,255,.7);animation:bgglow 1.6s ease-in-out infinite}
.badge.bgw::before{content:"";width:7px;height:7px;border-radius:50%;background:#b57cff;animation:bgpulse 1.4s ease-out infinite}
@keyframes bgglow{50%{box-shadow:0 0 22px rgba(181,124,255,.6)}}
@keyframes bgpulse{0%{box-shadow:0 0 0 0 rgba(181,124,255,.75)}70%{box-shadow:0 0 0 9px rgba(181,124,255,0)}100%{box-shadow:0 0 0 0 rgba(181,124,255,0)}}
.s-bgw .dot{background:#b57cff;animation:bgpulse 1.4s ease-out infinite}
.bgside{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle;border-radius:50%;background:#b57cff;animation:bgpulse 1.4s ease-out infinite}
.schip b.bgw{background:#b57cff;box-shadow:0 0 0 0 rgba(181,124,255,.75);animation:bgpulse 1.4s ease-out infinite}
.jobwrap.bgw>summary{opacity:1;font-size:12px;font-weight:600;color:#e6d4ff;background:rgba(40,20,70,.85);border-color:rgba(181,124,255,.75);animation:bgglow 1.6s ease-in-out infinite}
.jobwrap.bgw>summary .dot{width:9px;height:9px;background:#b57cff;animation:bgpulse 1.4s ease-out infinite}
.badge.ans{color:#bfe0ff;background:rgba(74,168,255,.14);border:1px solid rgba(74,168,255,.45)}
/* waiting on work (11/1): turn finished, nothing asked, not safe to close */
.badge .pbar{display:block;height:3px;margin-top:3px;border-radius:2px;background:linear-gradient(90deg,#4aa8ff 0,#7fd3a8 var(--p),rgba(143,150,192,.25) var(--p))}
.badge:has(.pbar){flex-direction:column;align-items:stretch;gap:0}
.badge.wait{color:#c9cde6;background:rgba(143,150,192,.12);border:1px solid rgba(143,150,192,.4)}
/* your turn (10/4): the latest answer asked the user something */
.badge.turn{color:#d6ecff;background:rgba(74,168,255,.2);border:1px solid rgba(74,168,255,.7);box-shadow:0 0 16px rgba(74,168,255,.4);animation:glow 1.6s ease-in-out infinite}
.badge.turn::before{content:"";width:7px;height:7px;border-radius:50%;background:#4aa8ff}
.s-yourturn .dot{background:#4aa8ff;box-shadow:0 0 0 3px rgba(74,168,255,.25),0 0 14px #4aa8ff;animation:beat 1.2s infinite}
.yourturn{margin-top:10px;padding:8px 10px;border-radius:14px;background:rgba(8,22,40,.92);border:1px solid rgba(74,168,255,.6);display:flex;flex-direction:column;gap:7px;box-sizing:border-box;max-width:100%}
.yourturn b{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;color:#4aa8ff}
.yourturn b::before{content:"";width:7px;height:7px;border-radius:50%;background:#4aa8ff;animation:jobpulse 1.4s ease-out infinite;box-shadow:0 0 0 0 rgba(74,168,255,.7)}
.yourturn .tq{font-size:13px;color:#e6f2ff;line-height:1.4;overflow-wrap:anywhere}
.yourturn .qr{display:flex;flex-wrap:wrap;gap:6px}
.yourturn .qa{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid rgba(74,168,255,.5);background:rgba(74,168,255,.12);color:#e6f2ff;cursor:pointer}
.yourturn .qa:hover{filter:brightness(1.3)}
.yourturn .qa.go{border-color:rgba(46,204,113,.75);background:rgba(46,204,113,.2);color:#c9f7da}
.yourturn .qa.stop{border-color:rgba(255,82,82,.75);background:rgba(255,82,82,.18);color:#ffd0d0}
.yourturn .qa.type{border-style:dashed;background:transparent;color:#a9c8ee}
/* 10/20 the user: "the sentence is the button" — option words inside the question itself are tappable */
.iqa{cursor:pointer;border-radius:6px;padding:0 4px;margin:0 -1px;background:rgba(150,110,255,.28);box-shadow:inset 0 0 0 1px rgba(170,135,255,.7);color:#efe6ff;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.iqa:hover{filter:brightness(1.3)}
.iqa.go{background:rgba(46,204,113,.26);box-shadow:inset 0 0 0 1px rgba(46,204,113,.8);color:#d4fbe2}
.iqa.stop{background:rgba(255,82,82,.24);box-shadow:inset 0 0 0 1px rgba(255,82,82,.8);color:#ffdcdc}
.a .iqr{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.a .iqr .qa{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid rgba(74,168,255,.5);background:rgba(74,168,255,.12);color:#e6f2ff;cursor:pointer}
.a .iqr .qa.go{border-color:rgba(46,204,113,.75);background:rgba(46,204,113,.2);color:#c9f7da}
.a .iqr .qa.stop{border-color:rgba(255,82,82,.75);background:rgba(255,82,82,.18);color:#ffd0d0}
/* 10/22: a tapped answer shows it took (pressed), the others go quiet, then the card leaves once it posts */
.qa:active,.iqa:active{transform:scale(.94)}
.qa.pressed,.iqa.pressed{transform:scale(.94);filter:brightness(1.5);box-shadow:0 0 0 2px rgba(255,255,255,.55) inset}
.qa.qwait,.iqa.qwait{opacity:.45;pointer-events:none}
@keyframes turnglow{50%{box-shadow:0 0 34px rgba(74,168,255,.6)}}
.badge.err{color:#ffc2cc;background:rgba(255,95,122,.14);border:1px solid rgba(255,95,122,.45)}
@keyframes glow{50%{box-shadow:0 0 26px rgba(255,171,61,.6)}}
@keyframes beat{50%{opacity:.55}}
/* background jobs card (10/4): pulsing ring, what's running, progress, ETA; sticks to the bottom of the chat */
.jobs{position:sticky;bottom:0;z-index:2;display:flex;flex-direction:column;gap:6px;margin-top:10px}
/* chat memory pill (10/5): how full the context is; orange at 60%, red at 80% */
.ctxm{align-self:flex-end;order:9;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut,#9aa);padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.atok{margin-top:4px;font-size:10.5px;color:var(--faint,#778);font-variant-numeric:tabular-nums}
/* 10/26 the user: copy the whole answer, like other chat apps */
.acts{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0}.acts .atok{margin:0}
.cpy{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;padding:0;border-radius:8px;border:1px solid var(--rim2,rgba(255,255,255,.12));background:rgba(255,255,255,.05);color:var(--faint,#99a);cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.cpy svg{width:14px;height:14px}.cpy:active{background:rgba(255,255,255,.14);color:#e6f2ff}
.fbback,.freshp{font:inherit;font-size:11px;line-height:1.3;cursor:pointer;padding:3px 11px;border-radius:999px;color:#bfe9d3;background:rgba(127,209,168,.12);border:1px solid rgba(127,209,168,.35);max-width:100%;white-space:nowrap}
.fbback{display:block;align-self:flex-start;width:fit-content;margin-top:8px}
.freshp{align-self:flex-end;order:10;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)} .freshp[disabled]{opacity:.6;cursor:default}
.ctxm .bar{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;display:inline-block}
.ctxm .bar i{display:block;height:100%;background:#7fd1a8}
.ctxm.warm .bar i{background:var(--need,#f0a040)} .ctxm.warm{color:var(--need,#f0a040)}
.ctxm.hot .bar i{background:var(--err,#ff5d5d)} .ctxm.hot{color:var(--err,#ff5d5d)}
.job{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(20,16,8,.82);border:1px solid rgba(255,170,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.job .ring{grid-row:1/3;width:12px;height:12px;border-radius:50%;background:#ffaa28;animation:jobpulse 1.4s ease-out infinite}
@keyframes jobpulse{0%{box-shadow:0 0 0 0 rgba(255,170,40,.7)}70%{box-shadow:0 0 0 10px rgba(255,170,40,0)}100%{box-shadow:0 0 0 0 rgba(255,170,40,0)}}
.job .jl{font-size:12px;color:#ffd08a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.job .jm{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:0}
.job .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;position:relative;min-width:40px}
.job .bar i{position:absolute;inset:0 auto 0 0;background:#ffaa28;border-radius:2px}
.job .bar.ind i{width:30%;animation:jobslide 1.6s ease-in-out infinite}
@keyframes jobslide{0%{left:-30%}100%{left:100%}}
.job .jeta{flex-shrink:0;white-space:nowrap}
.job .js{grid-column:2;display:flex;gap:6px;font-family:var(--mono);font-size:11px;color:#e8c58a;min-width:0}
.job .js .jst{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;animation:beat 1.6s infinite}
.job .js .ago{color:var(--faint);flex-shrink:0;white-space:nowrap}
.job .kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#ffaa28;margin-right:6px}
.empty{color:var(--faint);font-size:12px;padding:6px 6px 4px}

.launch{padding:10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;max-height:55%;overflow-y:auto}
.li{display:flex;flex-direction:column;gap:6px}
.lb{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;text-align:left;padding:8px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:color-mix(in srgb,var(--c) 70%,white)}
.lb:hover{background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--c) 35%,transparent)}
.ln{font-weight:600}
.lb small{flex-basis:100%;color:var(--dim);font-size:11px}
.on{font-size:11.5px;color:var(--m);font-weight:600}
.li.main .lb{padding:11px 14px;font-size:15px;box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-left:4px}
.chip{padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--c) 80%,white);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:rgba(255,255,255,.03)}
.chip.best{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.chip.best::after{content:" ★";font-size:10px}
.picker-card[data-why]{opacity:.45;filter:grayscale(.8)}   /* 10/26: this computer can't run it; tapping says why */
.grp{border-top:1px solid var(--rim2);padding-top:6px}
.hqrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:6px}
.mrow{display:flex;align-items:baseline;gap:8px;padding:2px 0}
.mlab{flex:0 0 38px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.m-head .plus{flex:none;width:30px;height:30px;border-radius:50%;font-size:19px;line-height:1;font-weight:500;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);cursor:pointer}
.m-head .plus.on{background:color-mix(in srgb,var(--c) 35%,transparent);transform:rotate(45deg)}
.plusmenu{position:relative;z-index:1;padding:0 4px 8px}
.dn-pill{position:relative;z-index:1;align-self:flex-start;margin:6px 4px 0;padding:2px 10px;border-radius:999px;font-size:11px;color:var(--dim);border:1px solid var(--rim2);background:rgba(255,255,255,.03);cursor:pointer}
.dn-pill b{color:var(--c);font-weight:600;margin-left:3px}
.ip-mach{flex:none;font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;line-height:14px;padding:0 6px;border-radius:999px;color:color-mix(in srgb,var(--mc) 80%,white);background:color-mix(in srgb,var(--mc) 22%,transparent);border:1px solid color-mix(in srgb,var(--mc) 60%,transparent);white-space:nowrap;align-self:center}
.card .ip-mach,.dn-row .ip-mach{display:inline-block;margin-right:6px;vertical-align:1px}
.sj-dev{flex:none;padding:1px 8px;border-radius:999px;font-size:10.5px;white-space:nowrap;color:#c4ebff;background:rgba(92,200,255,.1);border:1px solid rgba(92,200,255,.45)}
.sj-dev b{font-weight:700;color:color-mix(in srgb,var(--mc) 85%,white)}
/* 10/23 the user at ~870px: the bar wraps to a second line instead of cutting the title and the "open:" note */
.c-subj{flex-wrap:wrap;row-gap:3px}
.c-subj .sj-t{flex:1 1 auto;white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.c-subj .sj-op{flex:0 1 auto;max-width:none;white-space:normal;line-height:1.3}
.sj-end{margin-left:auto;flex:0 1 auto;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.dn-pill.on{color:var(--fg);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.dn-list{position:relative;z-index:1;display:flex;flex-direction:column;padding:2px 0 0}
.dn-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:8px;padding:5px 6px;font-size:12px;color:var(--dim);border-top:1px solid var(--rim2)}
.dn-row span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dn-row small{font-size:11px;white-space:nowrap}
.dn-row button{padding:1px 9px;border-radius:999px;font-size:11px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);cursor:pointer}
.apirow{position:relative;z-index:1;padding:0 4px 8px 14px}
.launch .apirow{padding:8px 0 0}
.pill.apip.on{color:#fff;background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c)}
.pill.apip{white-space:nowrap}
.pill .bal{font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.pill.hqp{color:#fff;background:color-mix(in srgb,var(--c) 40%,transparent);border-color:var(--c)}
.c-name em{font-style:normal;font-weight:600;color:var(--c);margin-right:6px}
.launch.slim{padding:8px 10px}
.drws{display:flex;gap:8px}
.drw{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);border:1px solid var(--rim2);background:rgba(255,255,255,.03);cursor:pointer}
.drw.on{color:var(--fg);background:rgba(255,255,255,.1)}
.launch.slim .pills{padding-top:8px}
.c-bar{display:flex;align-items:center;gap:8px;padding:6px 10px}
.c-bar .c-chips{flex:1;min-width:0;padding:0}
.c-bar .c-top{padding:0;flex:none}
.lbody{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rim2);padding-top:8px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 0}
.pill{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:color-mix(in srgb,var(--c) 75%,white);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:rgba(255,255,255,.04)}
.pill:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.chip.cc.act{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.viewcloud .chip.best:not(.cc){background:rgba(255,255,255,.03);box-shadow:none}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--dim);padding:4px 4px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"›";transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.grp>summary:hover{color:var(--fg)}
.cnt{font-size:10.5px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim)}
.items{display:flex;flex-direction:column;gap:6px;padding:6px 0 4px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:999px;background:#1b1f37;border:1px solid var(--rim);font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* conversation view */
.convo{flex:1;display:flex;flex-direction:column;min-height:0;gap:10px}
.c-top{display:flex;align-items:center;gap:8px;padding:8px 10px}
/* 10/16: one-tap chat switcher under the header (The user: "too many clicks" going All > machine > session) */
.c-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;flex-shrink:0}
.c-chips::-webkit-scrollbar{display:none}
.c-chips.none{display:none}
.schip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--c) 80%,white);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:rgba(255,255,255,.03)}
.schip small{font-weight:400;opacity:.65;font-size:11px}
.schip i.via{opacity:1;color:color-mix(in srgb,var(--mc) 85%,white);margin-left:-2px}
.schip i.via::before{content:"·";color:var(--dim);margin-right:4px;font-weight:400}
.schip i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.7}
.schip.cur{color:#fff;background:color-mix(in srgb,var(--c) 45%,transparent);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.schip b{width:8px;height:8px;border-radius:50%;background:var(--need);box-shadow:0 0 0 3px rgba(255,171,61,.25),0 0 10px var(--need);animation:beat 1.2s infinite}
.schip b.turn{background:#4aa8ff;box-shadow:0 0 0 3px rgba(74,168,255,.25),0 0 10px #4aa8ff}
.schip b.ans{background:#4aa8ff;box-shadow:0 0 8px #4aa8ff;animation:none}
.mpill{padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px;color:#fff;background:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
/* 10/21 subject bar: what this chat is about, in a slightly different tint of the chat's colour; tap to rename */
.c-subj{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;flex-shrink:0;border-radius:12px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,var(--glass2)),color-mix(in srgb,var(--c) 9%,var(--glass2)));border-color:color-mix(in srgb,var(--c) 35%,var(--rim))}
.sj-t{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:500;letter-spacing:.01em;text-align:left;color:color-mix(in srgb,var(--c) 30%,white);padding:2px 0}
.sj-t:hover{color:#fff}
.sj-in{flex:1;min-width:0;font:500 12px var(--sans);color:#fff;background:rgba(0,0,0,.3);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:8px;padding:2px 8px;outline:none}
.sj-r{margin-left:auto;flex:none;padding:2px 9px;border-radius:999px;font-size:11px;color:var(--dim);border:1px solid var(--rim);background:rgba(0,0,0,.18);white-space:nowrap}
.sj-r b{font-weight:600;color:var(--fg)}
.sj-r.on,.sj-r:hover{color:var(--fg);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.sj-drop{position:absolute;top:calc(100% + 4px);right:0;width:min(440px,100%);max-height:min(55vh,420px);overflow-y:auto;padding:6px;border-radius:12px;
  background:#0b0d1d;border:1px solid color-mix(in srgb,var(--c) 30%,var(--rim));box-shadow:0 12px 30px rgba(0,0,0,.6);scrollbar-width:thin;isolation:isolate}
.rq{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:7px;align-items:baseline;padding:4px 6px;border-radius:8px;font-size:12px;line-height:1.35}
.rq+.rq{border-top:1px solid var(--rim2)}
.rq i{font-style:normal;font-weight:700;text-align:center}
.rq.ok i{color:var(--ok)} .rq.no i{color:var(--err)}
.rq.gone{color:var(--faint)} .rq.gone s{text-decoration-color:var(--faint)} .rq.gone i{color:#c9b27a;font-weight:400} .rq.gone small{color:#c9b27a;font-family:var(--sans)}
.rq.sent{color:var(--dim)} .rq.sent i{color:var(--faint);font-weight:400} .rq.sent small{color:var(--faint);font-family:var(--sans)}
.rq span{overflow-wrap:anywhere}
.rq span em{display:block;font-style:normal;font-size:10.5px;color:var(--faint);margin-top:1px}   /* why it is a check or an X */
.rq small{color:var(--faint);font-size:10.5px;white-space:nowrap;font-family:var(--mono)}
.rq.no small{color:var(--dim);font-family:var(--sans)}
.rq.wait{color:var(--dim)} .rq.wait i{color:#bfe0ff;font-weight:400} .rq.wait small{color:#bfe0ff;font-family:var(--sans)}
.rq-h{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:7px 6px 2px;border-top:1px solid var(--rim2)}
.rq-h+.rq{border-top:0}
.sj-w{color:#bfe0ff}
.rq-note{font-size:11px;color:var(--faint);padding:4px 6px}
.rq-retry{font-size:11px;color:#ffc2cc;text-decoration:underline;text-underline-offset:2px;padding:0}
.sj-cur{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px;color:var(--dim)}
.sj-s{margin-left:auto}.sj-s+.sj-r{margin-left:0}
/* 10/23 the user: "Safe to close" = the chat's latest box says CLOSE: safe (all his asks in THIS chat done, nothing pending) */
.sj-ok{margin-left:auto;flex:none;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;color:#b9f5d6;background:rgba(62,224,143,.13);border:1px solid rgba(62,224,143,.5);box-shadow:0 0 10px rgba(62,224,143,.22)}
.sj-op{margin-left:auto;flex:0 1 auto;min-width:0;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px;color:rgba(255,171,61,.75)}
.sj-ok~.sj-r,.sj-op~.sj-r{margin-left:0}
/* 10/24 the user: the small ✓ Safe back beside the requests count */
.sj-ok.sj-mini{margin-left:0;padding:1px 8px;font-size:10.5px;font-family:inherit;cursor:pointer}
.badge.safe{color:#b9f5d6;background:rgba(62,224,143,.12);border:1px solid rgba(62,224,143,.48);padding:3px 9px;font-weight:600}
.schip b.ok{width:7px;height:7px;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:none}
@media (max-width:700px){.sj-op{max-width:90px}}
/* Subjects: a slim panel down the left on desktop, a dropdown on the phone; only opens on tap */
.sj-side{position:absolute;top:calc(100% + 4px);left:0;width:250px;max-height:calc(100vh - 220px);overflow-y:auto;padding:5px;border-radius:12px;
  background:#0b0d1d;border:1px solid color-mix(in srgb,var(--c) 30%,var(--rim));box-shadow:0 12px 30px rgba(0,0,0,.6);scrollbar-width:thin;display:flex;flex-direction:column}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:baseline;text-align:left;padding:5px 7px;border-radius:8px;font-size:12px;color:var(--dim)}
.tp+.tp{border-top:1px solid var(--rim2)}
.tp:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.tp.cur{color:var(--fg)}
.tp small{font-size:10.5px;color:var(--faint);white-space:nowrap}
@media (max-width:700px){.sj-side{right:0;width:auto;max-height:min(55vh,420px)}}
.c-title{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.c-title small{color:var(--dim);font-weight:400;margin-left:6px}
.ghost{padding:5px 11px;border-radius:999px;border:1px solid var(--rim);font-size:12px;color:var(--dim);background:rgba(255,255,255,.03);white-space:nowrap}
.ghost:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0;border-top:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.u{align-self:flex-end;max-width:88%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--c) 30%,rgba(30,34,70,.6));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:pre-wrap;overflow-wrap:anywhere}
.a{overflow-wrap:anywhere;line-height:1.55}
.a p{margin:0 0 8px}.a p:last-child{margin:0}
.a ul,.a ol{margin:0 0 8px;padding-left:20px}
.a code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.a pre{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.35);border:1px solid var(--rim2);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.a pre code{background:none;padding:0}
.a a{color:#9fd0ff}
.a h1,.a h2,.a h3{font-size:14px;margin:4px 0 6px}
.sofar{opacity:.72;margin-bottom:8px}
.work{margin-top:8px}
.work>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;border:1px solid var(--rim);color:var(--dim);font-size:11.5px;background:rgba(255,255,255,.03)}
.work>summary::-webkit-details-marker{display:none}
.work>summary::before{content:"›";transition:transform .15s}
.work[open]>summary::before{transform:rotate(90deg)}
.work>summary:hover{color:var(--fg)}
.steps{margin-top:8px;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:rgba(5,7,20,.55);border:1px solid var(--rim2)}
.step{font-family:var(--mono);font-size:11.5px;color:#c9cdf0;white-space:pre-wrap;overflow-wrap:anywhere}
.step.t{font-family:var(--sans);font-size:12px;color:var(--dim)}
.step details summary{cursor:pointer;list-style:none}
.step details summary::-webkit-details-marker{display:none}
.step details summary::after{content:"  · output";color:var(--faint);font-family:var(--sans);font-size:10.5px}
.step details[open] summary::after{content:""}
.step .out{margin:4px 0 4px 12px;color:#8f95bd;max-height:260px;overflow:auto;white-space:pre-wrap}
.step.bad{color:#ff9fb0}
.live{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.live .dot{width:9px;height:9px;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:beat 1.2s infinite}
.live-line{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ask{padding:12px;border-radius:14px;background:rgba(255,171,61,.1);border:1px solid rgba(255,171,61,.5);box-shadow:0 0 22px rgba(255,171,61,.2);display:flex;flex-direction:column;gap:8px}
.ask b{color:#ffd28c}
.ask .cmd{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
.ask .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid var(--rim)}
.btn.yes{background:rgba(62,224,143,.2);border-color:rgba(62,224,143,.6);color:#b9f5d6}
.btn.no{background:rgba(255,95,122,.14);border-color:rgba(255,95,122,.5);color:#ffc2cc}
.btn.opt{background:rgba(255,255,255,.06)}
.note{padding:10px 12px;border-radius:12px;font-size:12px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--rim2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note.err{color:#ffc2cc;border-color:rgba(255,95,122,.4)}
.compose{display:flex;gap:6px;padding:8px;align-items:center}
.compose textarea{flex:1;min-width:0;resize:none;max-height:70vh;scrollbar-width:none;background:rgba(0,0,0,.25);border:1px solid var(--rim);border-radius:14px;padding:9px 12px;color:var(--fg);font:inherit;outline:none}
.compose textarea::-webkit-scrollbar{display:none}
.compose textarea:focus{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.send{height:38px;padding:0 16px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 80%,white 0%),color-mix(in srgb,var(--c) 55%,#ff6fae));color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.send[disabled]{opacity:.4;cursor:default}

/* push to talk — lives in every conversation's message box. Tap: mic goes green and your words type into the box
   as you talk; tap again and it sends. Its state lives in micUi, so a re-render mid-recording redraws it as it was. */
.micb{width:28px;height:28px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;
  background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:color-mix(in srgb,var(--c) 60%,white);transition:transform .12s,background .2s}
.micb:hover{transform:scale(1.07);background:color-mix(in srgb,var(--c) 22%,transparent)}
.micb svg{width:14px;height:14px}
.micb.narr{margin-left:auto}
.micb.att svg{width:16px;height:16px}

// small, safe markdown: code fences, inline code, bold, links, lists, headings
function md(src){
  const hit = mdCache.get(src); if(hit) return hit;
  const out = md0(src); if(mdCache.size > 400) mdCache.clear(); mdCache.set(src, out); return out;
}
function md0(src){
  const blocks = String(src).split(/```/);
  return blocks.map((b,i)=>{
    if(i%2) return `<pre><code>${esc(b.replace(/^[^\n]*\n/,""))}</code></pre>`;
    const inline = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
      .replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    return b.split(/\n{2,}/).map(par=>{
      const lines = par.split("\n").filter(l=>l.trim());
      if(!lines.length) return "";
      if(lines.every(l=>/^\s*[-*•]\s/.test(l))) return "<ul>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*[-*•]\s/,""))+"</li>").join("")+"</ul>";
      if(lines.every(l=>/^\s*\d+[.)]\s/.test(l))) return "<ol>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*\d+[.)]\s/,""))+"</li>").join("")+"</ol>";
      if(/^#{1,3}\s/.test(lines[0])) return `<h3>${inline(lines[0].replace(/^#+\s/,""))}</h3>`+(lines.length>1?`<p>${lines.slice(1).map(inline).join("<br>")}</p>`:"");
      return "<p>"+lines.map(inline).join("<br>")+"</p>";
    }).join("");
  }).join("");
}

// latest answer in the chat bubble: drop the raw Options line, light up the option words in the
// last question paragraph, and show any leftovers as pills when the YOUR TURN card is not there
function answerHtml(d, txt){
  const opts = optsFor(txt); if(!opts.length) return md(txt);
  const body = txt.replace(OPT_RE, "").replace(/\n{3,}/g, "\n\n").trim();
  const paras = body.split(/\n{2,}/); let qi = -1;
  for(let k=paras.length-1;k>=0;k--) if(paras[k].includes("?")){ qi = k; break; }
  let html, qhtml = "";
  const head = qi<0 ? body : paras.slice(0,qi).join("\n\n");
  if(qi>=0 && !paras[qi].includes("```") && (head.match(/```/g)||[]).length%2===0){
    qhtml = inlineQA(md(paras[qi]), opts);
    html = (head ? md(head) : "") + qhtml + (qi<paras.length-1 ? md(paras.slice(qi+1).join("\n\n")) : "");
  } else html = md(body);
  const card = d.ask && !d.busy && !d.perm, qs = qaNow(d);
  const left = opts.filter(o=>!qhtml.includes(`data-quick="${esc(o)}"`));
  if(!card && left.length && !(qs && qs.phase === "sent")) html += `<div class="iqr">${left.map(o=>`<button class="qa ${qaTone(o)}${qaCls(o)}" data-quick="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  return html;
}
function qaTone(o){ return /^(yes|yep|looks good|go|approve|do it|send it|ok)\b/i.test(o) ? "go" : /^(no|nope|stop|don'?t|cancel|skip)\b/i.test(o) ? "stop" : ""; }
async function sendMsg(){
  const live = LiveCam.on() && liveFor === openId && ($("#ta")?.value.trim()) && await liveAttach(openId);
  const ta=$("#ta"); if(live && !/^\[live camera\]/.test(ta.value)) ta.value = "[live camera] " + ta.value.trim();
  const att = (pendAtt[openId]||[]).map(p => `[attached file: ${p}]`).join("\n");
  const text = [ta.value.trim(), att].filter(Boolean).join("\n"); if(!text) return;
  pendAtt[openId] = []; savePend(); attStrip();
  ta.value=""; drafts[openId]=""; autosize(ta);
  lastDictTap = lastCtrl = lastKey = 0;                                // you're done talking: show it now, no holding still
  (pendingSent[openId] = pendingSent[openId] || []).push({text, at: Date.now(), base: pendBase(D)}); savePending(); saveDrafts();
  if(D && D.perm) D.perm = null;                                     // 10/6: typing answers the open menu, so it goes away now
  if(D && D.turns) renderConvo(false);                                // on screen now, not after the round trip
  const r = await api(`/api/session/${encodeURIComponent(openId)}/send`,{text});
  if(r.answered){ pendingSent[openId] = []; savePending(); saveDrafts(); }           // it went in as the menu answer, not a separate message
  if(r.error === "ended" || r.error === "not found"){ pendingSent[openId] = []; savePending(); toast("That session was ended"); return back(); }
  if(r.id && r.id!==openId){ drafts[r.id]=""; open(r.id); return r; }   // a terminal session just moved in here
  refresh(false); return r;
}
document.addEventListener("keydown", e=>{
  if(e.target.id==="ta" && e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    micOffAndSend();
  }
  if(e.key==="Escape" && openId) back();
});
document.addEventListener("input", e=>{ if(e.target.id==="ta"){ autosize(e.target); drafts[openId]=e.target.value; saveDrafts(); lastKey=Date.now(); typingPing(); } });
// 10/21 chat-to-chat: while the user has words in this chat's box, tell its dock so no chat-send wakes it under him
let typingSent = {id:null, at:0};
function typingPing(){ const ta=$("#ta"); if(!openId || !ta || !ta.value.trim()) return;
  if(typingSent.id===openId && Date.now()-typingSent.at < 8000) return; typingSent = {id:openId, at:Date.now()};
  api(`/api/session/${encodeURIComponent(openId)}/typing`, {}).catch(()=>{}); }
setInterval(()=>{ if(!document.hidden && document.hasFocus() && Date.now()-lastKey < 120000) typingPing(); }, 10000);

let pending=false, stale=false;
// a hidden tab doesn't refetch; it catches up the moment you look at it
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && stale){ stale=false; refresh(); } });
let esTries=0, esLive=null;
function connect(){
  const es = new EventSource(BASE + "api/events");
  esLive = es;
  es.onopen = ()=>{ esTries=0; if(!document.hidden) refresh(); };   // back after a drop: catch up on what we missed
  // the browser retries a dropped stream on its own, but a BAD STATUS kills an EventSource for good - and the
  // a remote tunnel answers 502 the second the internet blinks. That froze the page for good once:
  // usage kept polling 200 and the stream never came back. Reconnect ourselves, backing off to 30s.
  es.onerror = ()=>{ if(es.readyState !== 2) return; esLive=null;
    setTimeout(()=>{ if(!esLive) connect(); }, Math.min(30000, 1000 * 2 ** esTries++)); };
  es.onmessage = ev=>{ try{ const j=JSON.parse(ev.data); const v=j.v; if(v){ if(window.__v && v!==window.__v){ if(!reloadSoon.waiting){ reloadSoon.waiting=true; reloadSoon(); } return; } window.__v=v; }
      // 10/24 the user: he pressed the iPhone Action Button to talk: stop the Heart voice now
      if(j.hush){ if(window.__h!==undefined && j.hush>window.__h) narrHush(); window.__h=j.hush; }
      // a Desktop launcher on this computer just started a session: jump to it
      if(j.focus){ if(window.__f===undefined) window.__f=j.focus.at; else if(j.focus.at>window.__f){ window.__f=j.focus.at; open(j.focus.id); return; } }
      else if(window.__f===undefined) window.__f=0;
    }catch{} if(document.activeElement?.id==="ta" && openId && !D?.busy && !D?.perm){} if(pending) return; pending=true; setTimeout(()=>{pending=false; if(document.hidden){ stale=true; return; } refresh();},400); };
}
let lastKey = 0;
var missCount = 0;   // var, not let: refresh() can run before this line is reached
function reloadSoon(){   // a design change landed: reload, but only once the box is empty and you're not mid-thought
  // Phone: a reload makes the iPhone forget it may play sound until the next tap, so the next answer went
  // unspoken (10/3). There, wait until you leave the page (switch apps, lock the phone) and reload then.
  if(IS_PHONE){ if(!reloadSoon.armed){ reloadSoon.armed = true;
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ saveDrafts(); location.reload(); } }); } return; }
  const ta = $("#ta");
  // 10/23: a design change could be held off forever on a machine the user is using - any Ctrl press, or Windows
  // dictation left on, re-armed the 60s wait every time. Words in flight still win, but only for 90 seconds;
  // after that an empty box with nothing recording reloads, so a change always lands within ~2 minutes.
  reloadSoon.since = reloadSoon.since || Date.now();
  const late = Date.now() - reloadSoon.since > 90000;
  // lastCtrl: your own Ctrl-Ctrl dictation may be mid-sentence with words not in the box yet - a reload wipes them
  // 10/23: words sitting in the box held a reload off forever (his window stayed on an old page for hours); the box is
  // saved as a draft and comes back after the reload, so after 90s only a live mic or a keystroke in the last 10s waits
  if(rec || sr || osDict || micUi.cls || (late && Date.now()-lastKey < 10000) ||
     (!late && ((ta && ta.value.trim()) || Date.now()-lastKey < 3000 || Date.now()-lastCtrl < 60000))) return setTimeout(reloadSoon, 1500);
  saveDrafts(); location.reload();
}
const h = decodeURIComponent(location.hash.slice(1)); if(h) openId=h;
refresh(false); connect();
// 10/23: a window whose event stream went quiet never heard about new versions. Once a minute, fetch this same page from
// the same place it was loaded (dock or proxied copy, so never a version that place can't serve yet) and reload when it changed.
(()=>{ const src = () => fetch(location.href.split("#")[0], {cache:"no-store"}).then(r => r.ok ? r.text() : null).catch(() => null);
  let base = null; src().then(t => { base = t; });
  setInterval(async ()=>{ const t = await src(); if(!t || !t.includes("</html>")) return; if(base === null){ base = t; return; }
    if(t !== base && !reloadSoon.waiting){ reloadSoon.waiting = true; reloadSoon(); } }, 60000); })();

/* aurora rest: pause the background drift after 45s with no input, resume on any touch */
(()=>{ let t; const wake=()=>{ document.body.classList.remove("aurora-rest"); clearTimeout(t);
  t=setTimeout(()=>document.body.classList.add("aurora-rest"),45000); };
  for(const e of ["pointermove","pointerdown","keydown","wheel","touchstart"]) addEventListener(e,wake,{passive:true});
  wake(); })();
</script>
